<!DOCTYPE html>
<html lang="en">
<head>
  <title>Classroom Seating Display | LockwoodSTEM</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="description" content="Private LockwoodSTEM classroom and FabLab seating display.">
  <link href="../assets/css/styles.css" rel="stylesheet">
  <script defer src="../assets/js/main.js"></script>
  <style>
    body.seating-display-page{
      min-height:100vh;
      background:linear-gradient(180deg,#07172B,#0B1F3A);
      overflow:hidden;
    }
    .seating-display-page .site-header{position:relative}
    .seating-display-page .nav{min-height:68px}
    .seating-display-page .brand-logo{height:42px;max-width:180px}
    .seating-display-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      width:min(1600px,96vw);
      margin:0 auto;
      padding:.75rem 0;
    }
    .seating-display-title{min-width:0}
    .seating-display-title strong{display:block;font-size:1rem;color:#fff}
    .seating-display-title span{display:block;color:#CBD5E1;font-size:.82rem}
    .seating-display-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
    .seating-display-actions .btn{margin:0}
    .seating-frame-shell{
      position:relative;
      width:100%;
      height:calc(100vh - 69px);
      background:#F8FAFC;
      border-top:1px solid rgba(255,255,255,.12);
    }
    .seating-frame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#F8FAFC;
    }
    .seating-loading{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:2rem;
      background:linear-gradient(180deg,#F8FAFC,#EAF0F8);
      color:#102033;
      text-align:center;
      z-index:1;
    }
    .seating-loading[hidden]{display:none}
    .seating-loading-card{
      width:min(560px,92vw);
      padding:1.5rem;
      border:1px solid #D7DEE9;
      border-radius:18px;
      background:#fff;
      box-shadow:0 12px 26px rgba(2,10,28,.15);
    }
    .seating-loading-card h1{font-size:1.4rem;color:#102033;margin-bottom:.4rem}
    .seating-loading-card p{color:#475569;margin-bottom:1rem}
    .seating-loading-card .btn{color:#0B1F3A!important}
    @media(max-width:760px){
      body.seating-display-page{overflow:auto}
      .seating-display-toolbar{align-items:flex-start;flex-direction:column;padding:.65rem 0}
      .seating-display-actions{width:100%;justify-content:flex-start}
      .seating-frame-shell{height:calc(100vh - 150px);min-height:640px}
      .seating-display-page .brand-text{display:none}
    }
    @media print{
      .site-header{display:none!important}
      .seating-frame-shell{height:100vh;border:0}
    }
  </style>
</head>
<body class="site-consistency-v4 seating-display-page">
  <a class="skip-link" href="#seating-tool">Skip to seating tool</a>
  <header class="site-header">
    <div class="seating-display-toolbar">
      <a aria-label="LockwoodSTEM home" class="brand" href="../index.html">
        <img alt="LockwoodSTEM logo" class="brand-logo" src="../assets/img/lockwoodstem-concept-a1-black-transparent.png">
        <span class="brand-text"><span class="brand-title">LockwoodSTEM</span><span class="brand-sub">Seating Display</span></span>
      </a>
      <div class="seating-display-title">
        <strong>Classroom &amp; FabLab Seating</strong>
        <span>Sign in with your LockwoodSTEM Google account when prompted.</span>
      </div>
      <div class="seating-display-actions">
        <button class="btn secondary small" id="refreshSeating" type="button">Refresh</button>
        <button class="btn secondary small" id="fullscreenSeating" type="button">Full Screen</button>
        <a class="btn small" href="https://script.google.com/a/macros/lockwoodstem.org/s/AKfycby8tl7eyXTGURr02NBRNyHW0I8kfPyvdWAMUPUkfD3E3LQpWoir-ogI_d74zhgSzEVB/exec" rel="noopener" target="_blank">Open Separately</a>
      </div>
    </div>
  </header>
  <main class="seating-frame-shell" id="seating-tool">
    <div class="seating-loading" id="seatingLoading" role="status" aria-live="polite">
      <div class="seating-loading-card">
        <h1>Loading the seating tool…</h1>
        <p>If Google blocks the embedded sign-in screen, open the tool in a separate tab and sign in there.</p>
        <a class="btn" href="https://script.google.com/a/macros/lockwoodstem.org/s/AKfycby8tl7eyXTGURr02NBRNyHW0I8kfPyvdWAMUPUkfD3E3LQpWoir-ogI_d74zhgSzEVB/exec" rel="noopener" target="_blank">Open Seating Tool</a>
      </div>
    </div>
    <iframe
      allow="fullscreen"
      class="seating-frame"
      id="seatingFrame"
      name="seatingFrame"
      referrerpolicy="strict-origin-when-cross-origin"
      src="https://script.google.com/a/macros/lockwoodstem.org/s/AKfycby8tl7eyXTGURr02NBRNyHW0I8kfPyvdWAMUPUkfD3E3LQpWoir-ogI_d74zhgSzEVB/exec"
      title="LockwoodSTEM classroom and FabLab seating tool">
    </iframe>
  </main>
  <script>
    (function() {
      const frame = document.getElementById('seatingFrame');
      const loading = document.getElementById('seatingLoading');
      const refreshButton = document.getElementById('refreshSeating');
      const fullscreenButton = document.getElementById('fullscreenSeating');
      const shell = document.getElementById('seating-tool');

      frame.addEventListener('load', function() {
        window.setTimeout(function() { loading.hidden = true; }, 350);
      });

      refreshButton.addEventListener('click', function() {
        loading.hidden = false;
        frame.src = frame.src;
      });

      fullscreenButton.addEventListener('click', async function() {
        try {
          if (!document.fullscreenElement) {
            await shell.requestFullscreen();
            fullscreenButton.textContent = 'Exit Full Screen';
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {
          window.open(frame.src, '_blank', 'noopener');
        }
      });

      document.addEventListener('fullscreenchange', function() {
        if (!document.fullscreenElement) fullscreenButton.textContent = 'Full Screen';
      });
    }());
  </script>
</body>
</html>
