name: Publish IED 1.7 resources

on:
  push:
    paths:
      - '.build/ied17/**'
      - '.github/workflows/publish-ied-1-7-resources.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generators
        run: pip install reportlab python-pptx pillow
      - name: Decode and build IED 1.7 resources
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          data = pathlib.Path('.build/ied17/build_ied17.pyz.b64').read_text().strip()
          pathlib.Path('/tmp/build_ied17.py').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY
          REPO_ROOT="$GITHUB_WORKSPACE" python /tmp/build_ied17.py
      - name: Publish generated resources and remove temporary builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/templates/IED_1_7_Joining_Methods_Connection_Decision_Lab.pdf
          git add downloads/presentations/IED_1_7_Joining_Methods_Assembly_Systems_Presentation.pptx
          git add downloads/teacher-guides/IED_1_7_Joining_Methods_Teacher_Setup_Guide.pdf
          git rm -r .build/ied17
          git rm .github/workflows/publish-ied-1-7-resources.yml
          git commit -m "Publish IED 1.7 student resources"
          git push
# trigger after page update
