name: Unified Lab QA
on:
  pull_request:
    paths: ['lab/**', '.github/workflows/unified-lab-qa.yml', 'resources/index.html']
  push:
    branches: [main]
    paths: ['lab/**', '.github/workflows/unified-lab-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JavaScript syntax
        run: |
          node --check lab/lab.js
          node --check lab/lab-ui.js
          node --check lab/lab-classifier.js
          node --check lab/train/store.js
          node --check lab/train/train.js
          node --check lab/worker-v2.js
      - name: Verify required pages and cross-links
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("lab/index.html").read_text()
          js=Path("lab/lab.js").read_text()
          worker=Path("lab/worker-v2.js").read_text()
          resources=Path("resources/index.html").read_text()
          assert 'src="./lab.js"' in html and 'new Worker("./worker-v2.js")' in js
          assert 'href="../lab/"' in resources
          assert 'EMERGENCY STOP' in html and 'const allow=new Set' in js
          assert 'def serial_send' in worker and 'def get_detections' in worker
          assert 'getUserMedia' in js and 'cocoSsd.load' in js
          assert 'lab.css' in html and 'lab-ui.js' in html
          assert 'site-header' in html and 'brand-logo' in html
          assert Path('lab/lab.css').exists() and Path('lab/lab-ui.js').exists()
          assert 'href="./train/"' in html
          assert Path('lab/train/index.html').exists() and Path('lab/train/train.js').exists()
          assert 'lockwoodstem-classifier-v1' in Path('lab/train/train.js').read_text()
          assert 'getUserMedia' in Path('lab/train/train.js').read_text()
          assert 'annotations.json' in Path('lab/train/train.js').read_text()
          print("Unified lab static integration checks passed")
          PY
