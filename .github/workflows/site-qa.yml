name: LockwoodSTEM Site QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate course site
        run: python scripts/site_qa.py
