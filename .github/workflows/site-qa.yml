name: LockwoodSTEM Site QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate course site
        run: python scripts/site_qa.py

      - name: Build canonical catalog
        run: python scripts/build_catalog.py
      - name: Validate public links and account retirement
        run: python scripts/check_public_site.py

      - name: Validate lesson guides and report accessibility
        run: python scripts/check_learning.py
      - name: Validate investigation models and draft answers
        run: node scripts/test_learning.cjs
