name: Publish IED 1.6 resources

on:
  push:
    paths:
      - '.build/ied16/**'
      - '.github/workflows/publish-ied-1-6-resources.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generators
        run: pip install reportlab python-pptx
      - name: Build student resources
        run: |
          cat .build/ied16/part_* > /tmp/build_ied16.py
          REPO_ROOT="$GITHUB_WORKSPACE" python /tmp/build_ied16.py
      - name: Publish generated resources and remove temporary builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/templates/IED_1_6_Measurement_and_Inspection_Student_Packet.pdf
          git add downloads/references/IED_1_6_Inspection_Drawings.pdf
          git add downloads/presentations/IED_1_6_Measurement_Precision_Tolerances_Presentation.pptx
          git rm -r .build/ied16
          git rm .github/workflows/publish-ied-1-6-resources.yml
          git commit -m "Publish IED 1.6 student resources"
          git push
