<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 z" fill="#0b1f3a"/>
  </marker>
  <style>
    .bg{fill:#fff}
    .panel{fill:#f8fafc;stroke:#c7d2dc;stroke-width:2}
    .band{fill:#edf2f7}
    .badge{fill:#f3c95c}
    .title{font:700 42px Arial,sans-serif;fill:#0b1f3a}
    .sub{font:23px Arial,sans-serif;fill:#526579}
    .letter{font:700 28px Arial,sans-serif;fill:#0b1f3a}
    .name{font:700 25px Arial,sans-serif;fill:#0b1f3a}
    .shape{fill:none;stroke:#0b1f3a;stroke-width:5;stroke-linejoin:round}
    .center{fill:none;stroke:#7a8ba0;stroke-width:2;stroke-dasharray:10 8}
    .dim{fill:none;stroke:#0b1f3a;stroke-width:2.2;marker-start:url(#arrow);marker-end:url(#arrow)}
    .ext{stroke:#8091a5;stroke-width:2}
    .dtxt{font:700 21px Arial,sans-serif;fill:#0b1f3a;stroke:#f8fafc;stroke-width:9px;paint-order:stroke fill;stroke-linejoin:round}
    .foot{font:21px Arial,sans-serif;fill:#526579}
  </style>
</defs>

<rect class="bg" width="1600" height="1180"/>
<text x="80" y="65" class="title">IED 2.4 — Dimensioned CAD Sketches</text>
<text x="80" y="105" class="sub">Create each profile in Fusion. Apply geometric constraints first, then dimensions. All dimensions are in millimeters.</text>

<!-- A PANEL -->
<rect x="60" y="145" width="720" height="450" rx="20" class="panel"/>
<path d="M60 165 Q60 145 80 145 H760 Q780 145 780 165 V235 H60 Z" class="band"/>
<rect x="90" y="168" width="58" height="42" rx="9" class="badge"/>
<text x="108" y="198" class="letter">A</text>
<text x="172" y="198" class="name">Rectangle + Centered Hole</text>

<!-- A geometry: 80 x 40, hole Ø20, center 30 from left -->
<rect x="225" y="320" width="360" height="180" class="shape"/>
<circle cx="360" cy="410" r="45" class="shape"/>
<line x1="360" y1="345" x2="360" y2="475" class="center"/>
<line x1="295" y1="410" x2="425" y2="410" class="center"/>
<!-- width -->
<line x1="225" y1="515" x2="225" y2="555" class="ext"/><line x1="585" y1="515" x2="585" y2="555" class="ext"/>
<line x1="235" y1="545" x2="575" y2="545" class="dim"/><text x="394" y="538" class="dtxt">80</text>
<!-- height -->
<line x1="185" y1="320" x2="225" y2="320" class="ext"/><line x1="185" y1="500" x2="225" y2="500" class="ext"/>
<line x1="195" y1="330" x2="195" y2="490" class="dim"/><text x="157" y="417" class="dtxt">40</text>
<!-- center x -->
<line x1="225" y1="280" x2="225" y2="320" class="ext"/><line x1="360" y1="280" x2="360" y2="345" class="ext"/>
<line x1="235" y1="290" x2="350" y2="290" class="dim"/><text x="282" y="283" class="dtxt">30</text>
<!-- hole -->
<line x1="392" y1="378" x2="445" y2="325" class="ext"/><text x="452" y="321" class="dtxt">Ø20</text>

<!-- B PANEL -->
<rect x="820" y="145" width="720" height="450" rx="20" class="panel"/>
<path d="M820 165 Q820 145 840 145 H1520 Q1540 145 1540 165 V235 H820 Z" class="band"/>
<rect x="850" y="168" width="58" height="42" rx="9" class="badge"/>
<text x="868" y="198" class="letter">B</text>
<text x="932" y="198" class="name">Rounded Shoulder Profile</text>

<!-- B geometry: 90 wide, 60 high, 2x R20, 50 top flat -->
<!-- scale 4 px/mm: W360 H240, R80, top flat 200 -->
<path d="M1010 515 L1370 515 L1370 355
         A80 80 0 0 0 1290 275
         L1090 275
         A80 80 0 0 0 1010 355 Z" class="shape"/>
<!-- width 90 -->
<line x1="1010" y1="530" x2="1010" y2="570" class="ext"/><line x1="1370" y1="530" x2="1370" y2="570" class="ext"/>
<line x1="1020" y1="560" x2="1360" y2="560" class="dim"/><text x="1178" y="553" class="dtxt">90</text>
<!-- height 60 -->
<line x1="1390" y1="275" x2="1440" y2="275" class="ext"/><line x1="1390" y1="515" x2="1440" y2="515" class="ext"/>
<line x1="1430" y1="285" x2="1430" y2="505" class="dim"/><text x="1444" y="402" class="dtxt">60</text>
<!-- top flat 50 -->
<line x1="1090" y1="245" x2="1090" y2="275" class="ext"/><line x1="1290" y1="245" x2="1290" y2="275" class="ext"/>
<line x1="1100" y1="255" x2="1280" y2="255" class="dim"/><text x="1178" y="248" class="dtxt">50</text>
<!-- radius note -->
<line x1="1324" y1="309" x2="1375" y2="258" class="ext"/><text x="1382" y="252" class="dtxt">2X R20</text>

<!-- C PANEL -->
<rect x="60" y="635" width="720" height="450" rx="20" class="panel"/>
<path d="M60 655 Q60 635 80 635 H760 Q780 635 780 655 V725 H60 Z" class="band"/>
<rect x="90" y="658" width="58" height="42" rx="9" class="badge"/>
<text x="108" y="688" class="letter">C</text>
<text x="172" y="688" class="name">Two-Hole Plate</text>

<!-- C geometry: 100 x 45, 2x Ø16, first center 20, spacing 60 -->
<rect x="205" y="800" width="420" height="180" class="shape"/>
<circle cx="289" cy="890" r="34" class="shape"/><circle cx="541" cy="890" r="34" class="shape"/>
<line x1="289" y1="842" x2="289" y2="938" class="center"/><line x1="241" y1="890" x2="337" y2="890" class="center"/>
<line x1="541" y1="842" x2="541" y2="938" class="center"/><line x1="493" y1="890" x2="589" y2="890" class="center"/>
<!-- width -->
<line x1="205" y1="995" x2="205" y2="1035" class="ext"/><line x1="625" y1="995" x2="625" y2="1035" class="ext"/>
<line x1="215" y1="1025" x2="615" y2="1025" class="dim"/><text x="401" y="1018" class="dtxt">100</text>
<!-- height -->
<line x1="165" y1="800" x2="205" y2="800" class="ext"/><line x1="165" y1="980" x2="205" y2="980" class="ext"/>
<line x1="175" y1="810" x2="175" y2="970" class="dim"/><text x="138" y="897" class="dtxt">45</text>
<!-- first center -->
<line x1="205" y1="755" x2="205" y2="800" class="ext"/><line x1="289" y1="755" x2="289" y2="842" class="ext"/>
<line x1="215" y1="765" x2="279" y2="765" class="dim"/><text x="237" y="758" class="dtxt">20</text>
<!-- spacing -->
<line x1="289" y1="740" x2="289" y2="842" class="ext"/><line x1="541" y1="740" x2="541" y2="842" class="ext"/>
<line x1="299" y1="750" x2="531" y2="750" class="dim"/><text x="402" y="743" class="dtxt">60</text>
<text x="505" y="825" class="dtxt">2X Ø16</text>

<!-- D PANEL -->
<rect x="820" y="635" width="720" height="450" rx="20" class="panel"/>
<path d="M820 655 Q820 635 840 635 H1520 Q1540 635 1540 655 V725 H820 Z" class="band"/>
<rect x="850" y="658" width="58" height="42" rx="9" class="badge"/>
<text x="868" y="688" class="letter">D</text>
<text x="932" y="688" class="name">Independent Precision Sketch</text>

<!-- D: 100 base width, 35 base height, centered R30 crown, Ø20 hole -->
<!-- base 420 px; base height 147 px; crown R126 px -->
<path d="M1000 980 L1420 980 L1420 833 L1336 833
         A126 126 0 0 0 1084 833
         L1000 833 Z" class="shape"/>
<circle cx="1210" cy="833" r="42" class="shape"/>
<line x1="1210" y1="735" x2="1210" y2="930" class="center"/><line x1="1120" y1="833" x2="1300" y2="833" class="center"/>
<!-- width -->
<line x1="1000" y1="995" x2="1000" y2="1035" class="ext"/><line x1="1420" y1="995" x2="1420" y2="1035" class="ext"/>
<line x1="1010" y1="1025" x2="1410" y2="1025" class="dim"/><text x="1194" y="1018" class="dtxt">100</text>
<!-- base height -->
<line x1="960" y1="833" x2="1000" y2="833" class="ext"/><line x1="960" y1="980" x2="1000" y2="980" class="ext"/>
<line x1="970" y1="843" x2="970" y2="970" class="dim"/><text x="933" y="912" class="dtxt">35</text>
<!-- center 50 -->
<line x1="1000" y1="775" x2="1000" y2="833" class="ext"/><line x1="1210" y1="775" x2="1210" y2="735" class="ext"/>
<line x1="1010" y1="785" x2="1200" y2="785" class="dim"/><text x="1097" y="778" class="dtxt">50</text>
<!-- R30 -->
<line x1="1295" y1="748" x2="1350" y2="745" class="ext"/><text x="1357" y="750" class="dtxt">R30</text>
<!-- hole -->
<line x1="1240" y1="803" x2="1290" y2="760" class="ext"/><text x="1298" y="765" class="dtxt">Ø20</text>

<text x="80" y="1135" class="foot">A–C: guided practice/reference examples • D: independent precision sketch</text>
</svg>